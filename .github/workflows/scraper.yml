name: HD Truck Market Scraper

on:
  schedule:
    - cron: '0 10 * * 2,5'
  workflow_dispatch:

jobs:
  scrape_and_score:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Scraper
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python run_all_scrapers.py

      - name: Commit Updated Database and Dashboard
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated data pipeline update: New HD truck listings & dashboard update"
          file_pattern: 'hd_truck_market.db index.html'
